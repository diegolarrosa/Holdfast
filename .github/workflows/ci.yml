name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  CI: true
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Lee la version directamente de global.json, asi el CI y la maquina
      # de desarrollo compilan siempre con el mismo SDK. Cambiar global.json
      # alcanza para cambiar las dos cosas a la vez.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore
      - run: dotnet test --configuration Release --no-build --verbosity normal

  pack:
    # Solo al etiquetar: git tag v0.1.0 && git push --tags
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Lee la version directamente de global.json, asi el CI y la maquina
      # de desarrollo compilan siempre con el mismo SDK. Cambiar global.json
      # alcanza para cambiar las dos cosas a la vez.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet pack src/Holdfast/Holdfast.csproj --configuration Release --output artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*

  publish:
    # Trusted Publishing: nuget.org confirma con GitHub, por OIDC, que este
    # push sale de este repo y de este workflow, y entrega una clave que dura
    # una hora. No hay ningun secreto de larga vida guardado en ningun lado.
    #
    # Antes de que esto funcione hay que crear la politica en nuget.org:
    #   menu de usuario > Trusted Publishing > agregar
    #   Repository Owner : diegolarrosa
    #   Repository       : Holdfast
    #   Workflow File    : ci.yml        (solo el nombre, sin la ruta)
    #   Environment      : vacio
    # y guardar el usuario de nuget.org (el nombre de perfil, NO el mail) como
    # secret NUGET_USER en Settings > Secrets and variables > Actions.
    #
    # La regla de activacion de 7 dias aplica a repos privados. Este es
    # publico, asi que no corresponde.
    needs: pack
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      # Lo unico que este job necesita, y el motivo de que sea un job aparte:
      # el permiso de emitir el token OIDC no alcanza al resto del pipeline.
      id-token: write
      contents: read

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: artifacts

      - name: NuGet login (OIDC -> clave temporal)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: NuGet push
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
